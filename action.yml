name: "Agentic Earned Value (AEV)"
description: "Compute Agentic Earned Value (CPI, SPI, EAC, rework, agent cost) and publish AEV-REPORT.md plus a CPI badge."
author: "Gunpreet Sabharwall"
branding:
  icon: "bar-chart-2"
  color: "blue"

inputs:
  config:
    description: "Path to the AEV config file. hours.csv and agent-costs.csv are read from the same folder."
    default: ".aev/config.yml"
  output:
    description: "Where to write the report."
    default: "AEV-REPORT.md"
  badge:
    description: "Where to write the shields.io badge JSON."
    default: ".aev/badge.json"
  commit:
    description: "Commit the report and badge back to the repository ('true' or 'false')."
    default: "true"
  demo:
    description: "Run on the built-in sample data instead of this repository ('true' or 'false'). Nothing is committed."
    default: "false"
  github-token:
    description: "Token used to read issues and pull requests. The default built-in token is enough for public repositories."
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install AEV dependencies
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Calculate AEV
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PYTHONPATH: ${{ github.action_path }}/src
        AEV_CONFIG: ${{ inputs.config }}
        AEV_OUTPUT: ${{ inputs.output }}
        AEV_BADGE: ${{ inputs.badge }}
        AEV_DEMO: ${{ inputs.demo }}
      run: |
        if [ "$AEV_DEMO" = "true" ]; then
          python -m aev --demo --output "$RUNNER_TEMP/AEV-REPORT.md" --badge "$RUNNER_TEMP/badge.json" > /dev/null
          cat "$RUNNER_TEMP/AEV-REPORT.md" >> "$GITHUB_STEP_SUMMARY"
        else
          python -m aev --config "$AEV_CONFIG" --output "$AEV_OUTPUT" --badge "$AEV_BADGE" > /dev/null
          cat "$AEV_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Commit report
      if: ${{ inputs.commit == 'true' && inputs.demo != 'true' }}
      shell: bash
      env:
        AEV_OUTPUT: ${{ inputs.output }}
        AEV_BADGE: ${{ inputs.badge }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "$AEV_OUTPUT" "$AEV_BADGE"
        if git diff --cached --quiet; then
          echo "AEV report unchanged; nothing to commit."
          exit 0
        fi
        git commit --quiet -m "Update AEV report"
        git push || (git pull --rebase --quiet && git push)
