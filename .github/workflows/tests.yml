name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run demo from the command line
        run: PYTHONPATH=src python -m aev --demo

      - name: Check the committed demo report is up to date
        run: git diff --exit-code examples/demo

  action-demo:
    # Runs this repository's action exactly as other repositories would,
    # but on the built-in sample data and without committing anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          demo: "true"

  live-github-smoke-test:
    # Reads this repository's real issues through the GitHub API (read-only),
    # to prove the data fetching works. Uses the demo settings; nothing is committed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Fetch this repository's issues and build a report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python -m aev --config examples/demo/.aev/config.yml --repo "${{ github.repository }}" \
            --as-of "$(date -u +%F)" --output "$RUNNER_TEMP/AEV-REPORT.md" --badge "$RUNNER_TEMP/badge.json"
